<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TobeTube — Tesla Premium Video Experience</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/app.css">
    
    <!-- Libs -->
    <script src="https://cdn.jsdelivr.net/npm/jmuxer@2.0.5/dist/jmuxer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
</head>
<body>
    <div class="app-bg"></div>
    <div id="speech-hint" class="speech-hint speech-hint-hidden" role="status" aria-live="polite" aria-atomic="true"></div>

    <div class="app-container">
        <main id="content-area">
            <!-- Ana Sayfa (Karşılama) -->
            <section id="view-home" class="view-section active">
                <div class="welcome-screen">
                    <h1 class="welcome-title">Hoş Geldiniz</h1>
                    <p class="welcome-lead">Aşağıdan bir bölüm seçerek başlayın</p>
                    <p class="welcome-hint">YT1 veya YT2 menüsünü kullanın</p>
                </div>
            </section>

            <!-- YT1 (WebCodecs + Canvas) -->
            <section id="view-yt1" class="view-section">
                <div class="browse-toolbar-row">
                    <div class="section-search">
                        <div class="search-bar">
                            <input type="text" id="search-input-yt1" class="search-input-field" placeholder="Aramak istediğiniz kelimeyi yazınız" autocomplete="off" readonly inputmode="search" enterkeyhint="search">
                            <button type="button" id="search-btn-yt1">ARA</button>
                        </div>
                        <button type="button" class="search-aux-btn" id="voice-btn-yt1" title="Sesle ara" aria-label="Sesle ara">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                        </button>
                        <button type="button" class="search-aux-btn" id="keyboard-btn-yt1" title="Klavye" aria-label="Klavyeyi aç">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M8 16h8"/></svg>
                        </button>
                    </div>
                    <div class="category-chips">
                        <div class="chip active" data-query="">Trendler</div>
                        <div class="chip" data-query="Teknoloji">Teknoloji</div>
                        <div class="chip" data-query="Haberler">Haberler</div>
                        <div class="chip" data-query="Spor">Spor</div>
                    </div>
                </div>
                <div class="browse-body">
                    <div id="grid-yt1" class="video-grid">
                        <div class="loader"><div class="spinner"></div></div>
                    </div>
                </div>

                <div class="player-view-layout" id="player-container-yt1" style="display: none;">
                    <div class="player-main" id="player-fs-root-yt1">
                        <!-- Video Başlığı Üstte -->
                        <div class="video-header-box">
                            <h1 id="title-yt1" class="player-video-title">Yükleniyor...</h1>
                            <button type="button" class="back-to-grid-small" data-target="yt1" aria-label="Geri dön">
                                <span>Geri Dön</span>
                                <svg class="back-to-grid-x-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
                            </button>
                        </div>
                        
                        <div class="player-container" id="video-click-yt1">
                            <div class="tech-badge">TECH 1</div>
                            <canvas id="canvas-yt1"></canvas>
                        </div>
                        
                        <div class="external-controls">
                            <div id="controls-yt1" class="premium-controls"></div>
                        </div>
                    </div>
                    <div class="player-sidebar">
                        <h3>Önerilen Videolar</h3>
                        <div class="sidebar-grid" id="recommendations-yt1"></div>
                    </div>
                </div>
            </section>

            <!-- YT2 (WebCodecs + MJPEG) -->
            <section id="view-yt2" class="view-section">
                <div class="browse-toolbar-row">
                    <div class="section-search">
                        <div class="search-bar">
                            <input type="text" id="search-input-yt2" class="search-input-field" placeholder="Aramak istediğiniz kelimeyi yazınız" autocomplete="off" readonly inputmode="search" enterkeyhint="search">
                            <button type="button" id="search-btn-yt2">ARA</button>
                        </div>
                        <button type="button" class="search-aux-btn" id="voice-btn-yt2" title="Sesle ara" aria-label="Sesle ara">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                        </button>
                        <button type="button" class="search-aux-btn" id="keyboard-btn-yt2" title="Klavye" aria-label="Klavyeyi aç">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M8 16h8"/></svg>
                        </button>
                    </div>
                    <div class="category-chips">
                        <div class="chip active" data-query="">Trendler</div>
                        <div class="chip" data-query="Teknoloji">Teknoloji</div>
                        <div class="chip" data-query="Haberler">Haberler</div>
                        <div class="chip" data-query="Spor">Spor</div>
                    </div>
                </div>
                <div class="browse-body">
                    <div id="grid-yt2" class="video-grid">
                        <div class="loader"><div class="spinner"></div></div>
                    </div>
                </div>

                <div class="player-view-layout" id="player-container-yt2" style="display: none;">
                    <div class="player-main" id="player-fs-root-yt2">
                        <!-- Video Başlığı Üstte -->
                        <div class="video-header-box">
                            <h1 id="title-yt2" class="player-video-title">Yükleniyor...</h1>
                            <button type="button" class="back-to-grid-small" data-target="yt2" aria-label="Geri dön">
                                <span>Geri Dön</span>
                                <svg class="back-to-grid-x-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
                            </button>
                        </div>

                        <div class="player-container" id="video-click-yt2">
                            <div class="tech-badge">TECH 5</div>
                            <img id="img-yt2" alt="Stream">
                        </div>
                        
                        <div class="external-controls">
                            <div id="controls-yt2" class="premium-controls"></div>
                        </div>
                    </div>
                    <div class="player-sidebar">
                        <h3>Önerilen Videolar</h3>
                        <div class="sidebar-grid" id="recommendations-yt2"></div>
                    </div>
                </div>
            </section>
        </main>

        <div class="app-bottom-shell">
            <div class="dock-logo-block" id="nav-home-logo" title="Ana sayfa">
                <div class="logo-text dock-logo-text" aria-label="TobeTube">
                    <span class="logo-letter logo-letter-t1">T<svg class="logo-letter-play" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 14" aria-hidden="true"><path d="M3.2 4.2 L9.2 7 L3.2 9.8 Z" fill="#ffffff"/></svg></span><span class="logo-letter logo-letter-o">o</span><span class="logo-letter logo-letter-b1">b</span><span class="logo-letter logo-letter-e1">e</span><span class="logo-letter logo-letter-t2">T<svg class="logo-letter-play" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 14" aria-hidden="true"><path d="M3.2 4.2 L9.2 7 L3.2 9.8 Z" fill="#ffffff"/></svg></span><span class="logo-letter logo-letter-u">u</span><span class="logo-letter logo-letter-b2">b</span><span class="logo-letter logo-letter-e2">e</span>
                </div>
            </div>

            <nav class="bottom-menu">
                <div class="menu-item active" data-view="home">
                    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    <span>Ana Sayfa</span>
                </div>
                <div class="menu-item" data-view="yt1">
                    <svg viewBox="0 0 24 24"><path d="M21.58 7.19c-.23-.86-.91-1.54-1.77-1.77C18.25 5 12 5 12 5s-6.25 0-7.81.42c-.86.23-1.54.91-1.77 1.77C2 8.75 2 12 2 12s0 3.25.42 4.81c.23.86.91 1.54 1.77 1.77C5.75 19 12 19 12 19s6.25 0 7.81-.42c.86-.23 1.54-.91 1.77-1.77.42-1.56.42-4.81.42-4.81s0-3.25-.42-4.81zM10 15V9l5.2 3-5.2 3z"/></svg>
                    <span>YT1</span>
                </div>
                <div class="menu-item" data-view="yt2">
                    <svg viewBox="0 0 24 24"><path d="M21.58 7.19c-.23-.86-.91-1.54-1.77-1.77C18.25 5 12 5 12 5s-6.25 0-7.81.42c-.86.23-1.54.91-1.77 1.77C2 8.75 2 12 2 12s0 3.25.42 4.81c.23.86.91 1.54 1.77 1.77C5.75 19 12 19 12 19s6.25 0 7.81-.42c.86-.23 1.54-.91 1.77-1.77.42-1.56.42-4.81.42-4.81s0-3.25-.42-4.81zM10 15V9l5.2 3-5.2 3z"/></svg>
                    <span>YT2</span>
                </div>
                <div class="menu-item">
                    <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
                    <span>Canlı TV</span>
                </div>
                <div class="menu-item">
                    <svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69-.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
                    <span>Ayarlar</span>
                </div>
            </nav>

            <div class="version-badge">
                <div class="latest"><strong>C 260501.0085</strong></div>
            </div>
        </div>
    </div>

    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
