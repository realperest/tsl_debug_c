version: '3.9'
services:
  app:
    build: .
    ports:
      # Yerel: makinede 8004, konteyner icinde 3000 (Coolify ile ayni ic port)
      - "8004:3000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - APP_VERSION=260429.0002
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  redis-data:
